server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Never cache config.js — se reescribe en cada boot con la API_URL de la env var.
  location = /config.js {
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    expires -1;
  }

  # Cache agresivo para el resto de assets
  location ~* \.(?:css|js|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public";
    try_files $uri =404;
  }

  # Fallback a index.html (site chico, ruteo simple)
  location / {
    try_files $uri $uri/ /index.html;
  }
}
